<style>
/* VOICE occasion: um jogo de futebol para crianças, contra um chefão
   IDEA uma partida à noite num estádio lotado; menus como placar de estádio
   PICTURE a própria arena: o Craque contra o Juiz Apitão gigante, de camisa rosa
   COLOUR céu noturno #0b1640, gramado #2fa64a/#2a9843, juiz rosa #ec407a, cartão #ffd600, ouro #ffc400
   TYPE fonte pesada do sistema (Arial Black / system-ui 900), sem fontes externas
   LAYOUT canvas em tela cheia; arena 16:9 centralizada; controles de toque nos cantos da tela */
html,body{height:100%;margin:0;overflow:hidden;background:#07140d;color-scheme:dark;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#tela{position:fixed;inset:0;display:block;touch-action:none}
#sonda{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#vire{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#0b1640;color:#fff;font:900 22px/1.3 "Arial Black",system-ui,sans-serif;text-align:center;padding:24px}

.cel{width:64px;height:110px;border:6px solid #fff;border-radius:14px;position:relative;animation:girar 2.2s ease-in-out infinite}
.cel::after{content:"";position:absolute;left:50%;bottom:6px;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#fff}
@keyframes girar{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.cel{animation:none;transform:rotate(-90deg)}}

<body>
<canvas id="tela" aria-label="Jogo Craque vs. Juiz Apitão"></canvas>
<div id="sonda"></div>
<div id="vire" hidden><div class="cel"></div><p>Vire o celular<small>O jogo é na horizontal</small></p></div>
<script id="logica">
// ===== LÓGICA DO JOGO (sem nada de tela) =====
// Tudo aqui é só regra do jogo: dá para testar no computador sem abrir o navegador.

// ---------------------------------------------------------------
// AJUSTES: os números do jogo. Mude à vontade e veja o que acontece!
// ---------------------------------------------------------------
var AJUSTES = {
  largura: 960,          // tamanho da tela do jogo (não mexa)
  altura: 540,
  chao: 460,             // altura do gramado
  gravidade: 2200,       // quanto mais alto, mais rápido cai

  camisa: { cor: '#1e88e5', numero: 10 },   // cor e número da camisa do Craque

  craque: {
    velocidade: 300,         // velocidade andando
    pulo: 990,               // força do pulo (mais = pula mais alto)
    dashDist: 190,           // distância do drible (dash)
    dashTempo: 0.3,          // duração do drible (fica invencível e atravessa ataques)
    dashRecarga: 0.6,        // tempo até poder driblar de novo
    invencivelAposDano: 1.7, // tempo piscando depois de levar dano
    cadenciaChute: 0.14,     // tempo entre um chute e outro (segurando)
    velocidadeChute: 820,
    danoChute: 4,
    danoEspecial: 60,        // dano da Bomba de Ouro
    segmentosEspecial: 5,    // tamanho da barra ⚡
    acertosPorSegmento: 8,   // chutes que acertam para encher 1 segmento
  },

  dificuldades: {
    // multRespiro: descanso do chefão entre ataques; cura: corações devolvidos no intervalo de cada tempo
    amador:       { coracoes: 5, multAviso: 1.5, multVelocidadeChefe: 0.8, multRespiro: 1.3, bandeirinhas: 1, cura: 1 },
    profissional: { coracoes: 3, multAviso: 1.0, multVelocidadeChefe: 1.0, multRespiro: 1.0, bandeirinhas: 2, cura: 0 },
  },

  // Regras que valem para todos os chefões. Cada fase tem 3 níveis: 1º tempo, 2º tempo e prorrogação.
  chefe: {
    niveis: [0.40, 0.35, 0.25],  // pedaço da vida em cada nível
    avisoMin: 0.6,               // tempo mínimo de aviso antes de cada ataque
    respiro: [1.3, 1.3, 1.1],    // descanso entre ataques em cada nível
    transicao: 1.5,              // pausa na troca de nível
  },
  juiz: { vida: 1600 },          // Fase 1: vida do Juiz Apitão (mais = luta mais longa)
  goleiro: { vida: 1700 },       // Fase 2: vida do Goleirão Bigodão
};

// ---------------------------------------------------------------
// Ajudantes de matemática e colisão
// ---------------------------------------------------------------
function limitar(v, min, max) { return v < min ? min : v > max ? max : v; }

// a e b são retângulos {x, y, w, h} (x,y = canto de cima à esquerda)
function colideRetRet(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// c é um círculo {x, y, r}, r é um retângulo
function colideCircRet(c, r) {
  var px = limitar(c.x, r.x, r.x + r.w), py = limitar(c.y, r.y, r.y + r.h);
  var dx = c.x - px, dy = c.y - py;
  return dx * dx + dy * dy < c.r * c.r;
}

// ---------------------------------------------------------------
// CONTROLE: o que o jogador está apertando agora
// ---------------------------------------------------------------
function criarControle() {
  return { esquerda: false, direita: false, cima: false, baixo: false,
           chute: false, pulo: false, dash: false, especial: false };
}

// ---------------------------------------------------------------
// CRAQUE: o nosso herói
// ---------------------------------------------------------------
var CRAQUE_W = 40, CRAQUE_H = 70, CRAQUE_H_AGACHADO = 44;

function criarCraque(dificuldade) {
  return {
    x: 140, y: AJUSTES.chao - CRAQUE_H, vx: 0, vy: 0, w: CRAQUE_W, h: CRAQUE_H,
    virado: 1, noChao: true, agachado: false,
    coracoes: AJUSTES.dificuldades[dificuldade].coracoes,
    invencivel: 0, dashTempo: 0, dashRecarga: 0, dashDir: 1, recargaChute: 0,
    especial: 0, acertosAcum: 0, estado: 'parado',
    antes: { pulo: false, dash: false, especial: false },  // para saber quando o botão "acabou de ser apertado"
  };
}

// Para onde o chute vai: segue o direcional (8 direções). Sem direcional, para onde está virado.
function direcaoMira(c, controle) {
  var dx = controle.direita ? 1 : controle.esquerda ? -1 : 0;
  var dy = controle.cima ? -1 : 0;
  if (dx === 0 && dy === 0) dx = c.virado;
  var n = Math.hypot(dx, dy);
  return { dx: dx / n, dy: dy / n };
}

// Tenta machucar o Craque. Devolve true se machucou.
function ferirCraque(c) {
  if (c.invencivel > 0 || c.dashTempo > 0 || c.coracoes <= 0) return false;
  c.coracoes -= 1;
  c.invencivel = AJUSTES.craque.invencivelAposDano;
  return true;
}

// Cada chute que acerta enche um pouquinho a barra ⚡
function ganharEspecial(c) {
  var K = AJUSTES.craque;
  if (c.especial >= K.segmentosEspecial) return;
  c.acertosAcum += 1;
  if (c.acertosAcum >= K.acertosPorSegmento) { c.acertosAcum = 0; c.especial += 1; }
}

// Move o Craque um pedacinho de tempo (dt). Chutes novos vão para saida.chutes.
function atualizarCraque(c, controle, dt, saida) {
  var K = AJUSTES.craque;
  var apertou = function (b) { return controle[b] && !c.antes[b]; };

  c.invencivel = Math.max(0, c.invencivel - dt);
  c.dashRecarga = Math.max(0, c.dashRecarga - dt);
  c.recargaChute = Math.max(0, c.recargaChute - dt);

  // Drible (dash)
  if (apertou('dash') && c.dashTempo <= 0 && c.dashRecarga <= 0) {
    c.dashDir = controle.direita ? 1 : controle.esquerda ? -1 : c.virado;
    c.virado = c.dashDir;
    c.dashTempo = K.dashTempo;
    c.dashId = (c.dashId || 0) + 1;    // cada drible tem um número (para contar os OLÉs)
    c.dashRecarga = K.dashTempo + K.dashRecarga;
    c.agachado = false;
  }

  if (c.dashTempo > 0) {
    var passo = Math.min(dt, c.dashTempo);
    c.x += c.dashDir * (K.dashDist / K.dashTempo) * passo;
    c.vy = 0;
    c.dashTempo = Math.max(0, c.dashTempo - dt);
    c.estado = 'dash';
  } else {
    // Agachar (só no chão)
    c.agachado = controle.baixo && c.noChao;
    var dir = controle.direita ? 1 : controle.esquerda ? -1 : 0;
    if (dir !== 0) c.virado = dir;
    c.vx = c.agachado ? 0 : dir * K.velocidade;

    // Pulo
    if (apertou('pulo') && c.noChao) { c.vy = -K.pulo; c.noChao = false; c.agachado = false; }
    if (!controle.pulo && c.vy < -K.pulo * 0.35) c.vy = -K.pulo * 0.35; // soltou cedo: pulo baixo

    c.vy += AJUSTES.gravidade * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.estado = !c.noChao ? 'pulando' : c.agachado ? 'agachado' : dir ? 'andando' : 'parado';
  }

  // Altura (agachado é mais baixo) e chão
  var pes = c.y + c.h;
  c.h = c.agachado ? CRAQUE_H_AGACHADO : CRAQUE_H;
  c.y = pes - c.h;
  if (c.y + c.h >= AJUSTES.chao) { c.y = AJUSTES.chao - c.h; c.vy = 0; c.noChao = true; }
  else c.noChao = false;
  c.x = limitar(c.x, 0, AJUSTES.largura - c.w);

  // Chute
  if (controle.chute && c.recargaChute <= 0 && c.dashTempo <= 0) {
    var d = direcaoMira(c, controle);
    var bx = c.x + c.w / 2 + d.dx * 26, by = c.y + c.h * (c.agachado ? 0.55 : 0.45) + d.dy * 26;
    saida.chutes.push({ x: bx, y: by, vx: d.dx * K.velocidadeChute, vy: d.dy * K.velocidadeChute,
                        r: 8, dano: K.danoChute, especial: false });
    c.recargaChute = K.cadenciaChute;
  }

  // Bomba de Ouro (especial)
  if (apertou('especial') && c.especial >= K.segmentosEspecial) {
    var e = direcaoMira(c, controle);
    saida.chutes.push({ x: c.x + c.w / 2 + e.dx * 30, y: c.y + c.h * 0.45 + e.dy * 30,
                        vx: e.dx * K.velocidadeChute * 0.75, vy: e.dy * K.velocidadeChute * 0.75,
                        r: 26, dano: K.danoEspecial, especial: true });
    c.especial = 0; c.acertosAcum = 0;
  }

  c.antes.pulo = controle.pulo; c.antes.dash = controle.dash; c.antes.especial = controle.especial;
}

// ---------------------------------------------------------------
// CHEFÕES: cada fase tem um chefão. A ficha diz o nome, a vida e os ataques de cada nível.
// ---------------------------------------------------------------
var CHEFOES = {
  1: {
    tipo: 'juiz', nome: 'JUIZ APITÃO', vida: function () { return AJUSTES.juiz.vida; },
    // ataques de cada nível, com "peso" (mais peso = aparece mais)
    ataquesPorNivel: {
      1: { amarelo: 3, apitaco: 2, corrida: 2 },
      2: { amarelo: 2, spray: 2, bandeirinhas: 2, vermelho: 2 },
      3: { var: 3, chuva: 2, apitacoDuplo: 2, amarelo: 1 },
    },
  },
};

// Tempo de aviso (em segundos) antes de cada ataque. Nunca menos que AJUSTES.chefe.avisoMin.
var AVISO_BASE = {
  amarelo: 0.7, apitaco: 0.8, corrida: 0.9, spray: 0.8, bandeirinhas: 0.7,
  vermelho: 0.8, var: 1.0, chuva: 0.7, apitacoDuplo: 0.8,
};

var ATAQUES = {};   // todos os ataques de todos os chefões (definidos mais abaixo)
var CHEFE_W = 190, CHEFE_H = 300, CHEFE_X = AJUSTES.largura - CHEFE_W - 30;

function criarChefe(fase, dificuldade, aleatorio) {
  var ficha = CHEFOES[fase], vida = ficha.vida();
  return {
    tipo: ficha.tipo, fase: fase,
    x: CHEFE_X, y: AJUSTES.chao - CHEFE_H, w: CHEFE_W, h: CHEFE_H,
    vida: vida, vidaMax: vida, nivel: 1, estado: 'entrada', t: 1.2,
    ataqueAtual: null, ultimoAtaque: null, piscar: 0, olhando: -1,
    correndo: false, defendendo: false,
    dificuldade: dificuldade, aleatorio: aleatorio || Math.random,
  };
}

// A menor vida que o chefão pode ter neste nível (abaixo disso, muda de nível)
function limiteNivel(c, nivel) {
  var f = AJUSTES.chefe.niveis, tirado = 0;
  for (var i = 0; i < nivel; i++) tirado += f[i];
  return Math.max(0, Math.round(c.vidaMax * (1 - tirado)));
}

// Machuca o chefão. Devolve quanto de dano entrou de verdade.
function ferirChefe(c, dano) {
  if (c.estado === 'transicao' || c.estado === 'derrotado') return 0;
  var limite = limiteNivel(c, c.nivel);
  var aplicado = Math.min(dano, c.vida - limite);
  c.vida -= aplicado;
  c.piscar = 0.08;
  if (c.vida <= limite) {
    if (c.nivel < 3) { c.estado = 'transicao'; c.t = AJUSTES.chefe.transicao; }
    else { c.estado = 'derrotado'; c.t = 0; }
    c.ataqueAtual = null; c.defendendo = false;
  }
  return aplicado;
}

// Ataques que não podem repetir enquanto o anterior ainda está em campo
function ataqueAindaEmCampo(nome, jogo) {
  if (nome === 'bandeirinhas') return jogo.inimigos.some(function (i) { return i.tipo === 'bandeirinha'; });
  if (nome === 'vermelho') return jogo.perigos.some(function (p) { return p.tipo === 'vermelho'; });
  return false;
}

// Sorteia o próximo ataque (com pesos), sem repetir o último.
function escolherAtaque(c, jogo) {
  var opcoes = CHEFOES[c.fase].ataquesPorNivel[c.nivel], total = 0, nome, pode = {}, primeiro = null;
  for (nome in opcoes) {
    if (!primeiro) primeiro = nome;
    var ok = nome !== c.ultimoAtaque && !(jogo && ataqueAindaEmCampo(nome, jogo));
    if (ok) { pode[nome] = opcoes[nome]; total += opcoes[nome]; }
  }
  if (total === 0) { pode = {}; pode[primeiro] = 1; total = 1; }
  var sorteio = c.aleatorio() * total;
  for (nome in pode) { sorteio -= pode[nome]; if (sorteio < 0) break; }
  c.ultimoAtaque = nome;
  return nome;
}

function tempoRespiro(c) {
  return AJUSTES.chefe.respiro[c.nivel - 1] * AJUSTES.dificuldades[c.dificuldade].multRespiro;
}

function tempoAviso(c, nome) {
  var mult = AJUSTES.dificuldades[c.dificuldade].multAviso;
  return Math.max(AJUSTES.chefe.avisoMin, AVISO_BASE[nome] || 0) * mult;
}

// Máquina de estados: entrada → respiro → aviso → ataque → respiro ...
function atualizarChefe(c, dt, jogo) {
  c.piscar = Math.max(0, c.piscar - dt);
  // se o nível mudou no meio de uma corrida, ele volta andando para o lugar
  if ((c.estado === 'transicao' || c.estado === 'derrotado') && c.x !== CHEFE_X) {
    c.correndo = false;
    c.x = c.x < CHEFE_X ? Math.min(CHEFE_X, c.x + 500 * dt) : CHEFE_X;
    c.olhando = c.x === CHEFE_X ? -1 : 1;    // chegou: vira para o Craque de novo
  }
  if (c.estado === 'derrotado') return;
  c.t -= dt;
  if (c.estado === 'entrada' && c.t <= 0) {
    c.estado = 'respiro'; c.t = tempoRespiro(c);
  } else if (c.estado === 'transicao' && c.t <= 0) {
    c.nivel += 1; c.ultimoAtaque = null;
    c.estado = 'respiro'; c.t = tempoRespiro(c);
  } else if (c.estado === 'respiro' && c.t <= 0) {
    c.ataqueAtual = escolherAtaque(c, jogo);
    c.estado = 'aviso'; c.t = tempoAviso(c, c.ataqueAtual);
  } else if (c.estado === 'aviso' && c.t <= 0) {
    c.estado = 'ataque'; c.t = 0;
    ATAQUES[c.ataqueAtual].iniciar(jogo);
  } else if (c.estado === 'ataque') {
    if (ATAQUES[c.ataqueAtual].atualizar(jogo, dt)) {
      c.estado = 'respiro'; c.t = tempoRespiro(c);
    }
  }
}

// ---------------------------------------------------------------
// O JOGO: tudo o que existe na partida
// ---------------------------------------------------------------
function criarJogo(dificuldade, aleatorio, fase) {
  fase = fase || 1;
  return {
    dificuldade: dificuldade, fase: fase,
    craque: criarCraque(dificuldade),
    chefe: criarChefe(fase, dificuldade, aleatorio),
    chutes: [], perigos: [], inimigos: [],
    eventos: [],          // avisos para o app tocar sons e efeitos
    atk: { t: 0, agenda: [] },  // memória do ataque que está acontecendo
    tempo: 0, danoLevado: 0, estado: 'luta', pausado: false, acumulado: 0,
  };
}

// Caixa de colisão do Craque: um pouco menor que o desenho (para ser justo com quem joga)
function caixaCraque(c) { return { x: c.x + 5, y: c.y + 5, w: c.w - 10, h: c.h - 8 }; }

// Caixa de colisão do chefão. Correndo, ele fica abaixado (dá para pular por cima).
function caixaChefe(j) {
  if (j.correndo) return { x: j.x + 20, y: AJUSTES.chao - 140, w: 150, h: 140 };
  return { x: j.x + 30, y: j.y + 20, w: j.w - 40, h: j.h - 20 };
}

function perigoAcerta(p, c) {
  if (p.inativo) return false;
  var caixa = caixaCraque(c);
  return p.r ? colideCircRet(p, caixa) : colideRetRet(p, caixa);
}

function velChefe(jogo) { return AJUSTES.dificuldades[jogo.dificuldade].multVelocidadeChefe; }
function multAvisoDe(jogo) { return AJUSTES.dificuldades[jogo.dificuldade].multAviso; }
function maoChefe(j) { return { x: j.x + 10, y: j.y + 120 }; }
function centro(o) { return { x: o.x + o.w / 2, y: o.y + o.h / 2 }; }

// Agenda: "daqui a X segundos, faça tal coisa" (dentro de um ataque)
function comecarAtaque(jogo) { jogo.atk = { t: 0, agenda: [] }; }
function agendar(jogo, em, fazer) { jogo.atk.agenda.push({ em: em, fazer: fazer }); }
function rodarAgenda(jogo, dt) {
  jogo.atk.t += dt;
  var ag = jogo.atk.agenda;
  for (var i = ag.length - 1; i >= 0; i--) if (jogo.atk.t >= ag[i].em) { var f = ag[i].fazer; ag.splice(i, 1); f(); }
  return jogo.atk.t;
}

// ----- Peças dos ataques -----
function novoCartao(x, y, alvoX, alvoY, vel) {
  var dx = alvoX - x, dy = alvoY - y, n = Math.hypot(dx, dy) || 1;
  return { tipo: 'amarelo', x: x - 13, y: y - 9, w: 26, h: 18, vx: dx / n * vel, vy: dy / n * vel, giro: 0 };
}
function novaOnda(jogo) {
  return { tipo: 'onda', x: jogo.chefe.x - 30, y: AJUSTES.chao - 46, w: 30, h: 46, vx: -430 * velChefe(jogo), vy: 0 };
}
// Laser do VAR: alto = agache; baixo = pule
function novoLaser(alto) {
  var y = alto ? AJUSTES.chao - 100 : AJUSTES.chao - 38, h = alto ? 46 : 38;
  return { tipo: 'laser', alto: alto, x: AJUSTES.largura, y: y, w: 260, h: h, vx: -760, vy: 0 };
}

// ----- Os ataques do Juiz Apitão -----
// Cada um tem iniciar(jogo) e atualizar(jogo, dt) que devolve true quando terminou.
ATAQUES.amarelo = {
  iniciar: function (jogo) {
    comecarAtaque(jogo);
    var j = jogo.chefe, v = velChefe(jogo);
    var lancar = function (angulos, vel) {
      var m = maoChefe(j), alvo = centro(jogo.craque);
      var base = Math.atan2(alvo.y - m.y, alvo.x - m.x);
      angulos.forEach(function (a) {
        jogo.perigos.push(novoCartao(m.x, m.y, m.x + Math.cos(base + a) * 100, m.y + Math.sin(base + a) * 100, vel));
      });
      jogo.eventos.push('lanca');
    };
    if (j.nivel === 1) { [0, 0.3, 0.6].forEach(function (t) { agendar(jogo, t, function () { lancar([0], 380 * v); }); }); }
    else {
      agendar(jogo, 0, function () { lancar([-0.24, 0, 0.24], 410 * v); });
      agendar(jogo, 0.7, function () { lancar([0], 410 * v); });
    }
  },
  atualizar: function (jogo, dt) { return rodarAgenda(jogo, dt) >= 1.2; },
};

ATAQUES.apitaco = {
  iniciar: function (jogo) { comecarAtaque(jogo); jogo.perigos.push(novaOnda(jogo)); jogo.eventos.push('apito'); },
  atualizar: function (jogo, dt) { return rodarAgenda(jogo, dt) >= 0.5; },
};

ATAQUES.apitacoDuplo = {
  iniciar: function (jogo) {

function foraDaTela(o) {

    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;

    if (p.cai && p.y + p.h >= AJUSTES.chao) { some = true; jogo.eventos.push('pof'); }

  for (var k = ins.length - 1; k >= 0; k--) {

    if (b.tempo <= 0) { ins.splice(k, 1); continue; }

        var de = { x: b.x + b.w / 2, y: b.y + 8 }, para = centro(c);
        var ddx = para.x - de.x, ddy = para.y - de.y, nn = Math.hypot(ddx, ddy) || 1, vel = 240 * velChefe(jogo);
        ps.push({ tipo: 'bola', x: de.x, y: de.y, r: 9, vx: ddx / nn * vel, vy: ddy / nn * vel });

var PASSO = 1 / 60;

function passoJogo(jogo, controle, dt) {
  if (jogo.pausado || jogo.estado !== 'luta') return;
  // se o celular travou, não deixa o jogo "pular" um monte de tempo
  jogo.acumulado += Math.min(dt, 0.1);

function machucarCraque(jogo) {
  if (!ferirCraque(jogo.craque)) return false;
  jogo.danoLevado += 1;
  jogo.eventos.push('dano');
  if (jogo.craque.coracoes <= 0) { jogo.estado = 'derrota'; jogo.eventos.push('derrota'); }

  atualizarChefe(j, PASSO, jogo);
  atualizarPerigos(jogo, PASSO);
  atualizarChutes(jogo, PASSO);

  // Troca de nível: limpa a arena para dar um respiro

    jogo.emTransicao = true;
    jogo.perigos.length = 0; jogo.inimigos.length = 0; jogo.atk = { t: 0, agenda: [] };
    jogo.eventos.push('nivel');
    // intervalo: um golinho de água devolve corações (no Amador)

    if (dif.cura > 0 && c.coracoes < max) { c.coracoes = Math.min(max, c.coracoes + dif.cura); jogo.eventos.push('cura'); }
  } else if (j.estado !== 'transicao') jogo.emTransicao = false;

  if (j.estado === 'derrotado') { jogo.estado = 'vitoria'; jogo.eventos.push('vitoria'); return; }

  // Driblou através de um ataque? OLÉ! (ganha energia do especial)
  if (c.dashTempo > 0) {
    var driblou = false;
    jogo.perigos.forEach(function (p) {
      if (p.driblado !== c.dashId && perigoAcerta(p, c)) { p.driblado = c.dashId; driblou = true; }
    });
    if (j.driblado !== c.dashId && j.estado !== 'transicao' && colideRetRet(caixaChefe(j), caixaCraque(c))) { j.driblado = c.dashId; driblou = true; }
    if (driblou) {
      jogo.eventos.push('ole');
      for (var g = 0; g < 3; g++) ganharEspecial(c);
    }
  }

  // Craque encostou em algo perigoso?
  for (var i = jogo.perigos.length - 1; i >= 0; i--) {
    var p = jogo.perigos[i];
    if (perigoAcerta(p, c) && machucarCraque(jogo)) {
      if (PROJETEIS[p.tipo]) jogo.perigos.splice(i, 1);
      break;
    }
  }
  // encostar no chefão machuca (menos na pausa da troca de nível)
  if (jogo.estado === 'luta' && j.estado !== 'transicao' && colideRetRet(caixaChefe(j), caixaCraque(c))) machucarCraque(jogo);
}

// Nota no fim: S (perfeito), A, B ou C
function notaFinal(jogo) {
  if (jogo.danoLevado === 0 && jogo.tempo <= 150) return 'S';
  if (jogo.danoLevado <= 1) return 'A';
  if (jogo.danoLevado <= 2) return 'B';
  return 'C';
}

// Quanto da vida do chefão já foi tirada (0 = nada, 1 = tudo)
function progresso(jogo) { return 1 - jogo.chefe.vida / jogo.chefe.vidaMax; }

<script id="app">
// ===== APLICATIVO: toque, desenho, sons e telas =====
{
'use strict';
var LARG = AJUSTES.largura, ALT = AJUSTES.altura, CHAO = AJUSTES.chao;
var FONTE = '"Arial Black", "Helvetica Neue", Arial, system-ui, sans-serif';
var cv = document.getElementById('tela'), ctx = cv.getContext('2d');
var sonda = document.getElementById('sonda'), vire = document.getElementById('vire');
var W = 0, H = 0, DPR = 1, ESC = 1, OX = 0, OY = 0, SEG = { l: 0, r: 0, t: 0, b: 0 };
var CTRL = {}, fundo = null;

// ---------------------------------------------------------------
// IMAGENS: para usar desenhos dos meninos no lugar dos desenhos em código.
// Exemplo: var img = new Image(); img.src = 'data:image/png;base64,....'; IMAGENS.juiz = img;
// Nomes aceitos: craque, juiz, bandeirinha
// ---------------------------------------------------------------
var IMAGENS = {};
window.IMAGENS = IMAGENS;
function imagemPronta(nome) { var i = IMAGENS[nome]; return i && i.complete && i.naturalWidth > 0 ? i : null; }

var app = {
  tela: 'inicio', dificuldade: 'amador', mudo: false, jogo: null, pose: null,
  fimEm: 0, banner: null, tremor: 0, particulas: [], alvos: [], t: 0,
  recorde: null, novoRecorde: false, popups: [], dashAntes: false,
  dicas: { chute: false, drible: false, especial: false }, dica: null,
};

// ----- guardar recorde (pode não funcionar em aba anônima; tudo bem) -----
function lerRecorde(dif) { try { var v = localStorage.getItem('craque-recorde-' + dif); return v ? parseFloat(v) : null; } catch (e) { return null; } }
function salvarRecorde(dif, t) { try { localStorage.setItem('craque-recorde-' + dif, String(t)); } catch (e) { /* sem problema */ } }
function relogio(seg) { var m = Math.floor(seg / 60), s = Math.floor(seg % 60); return m + ':' + (s < 10 ? '0' : '') + s; }

// =================================================================
// TAMANHO DA TELA
// =================================================================
function medir() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ESC = Math.min(W / LARG, H / ALT);
  OX = (W - LARG * ESC) / 2; OY = (H - ALT * ESC) / 2;
  var cs = getComputedStyle(sonda);
  SEG = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  montarControles();
  fundo = null;
  verificarOrientacao();
}

function verificarOrientacao() {
  var emPe = H > W * 1.05;
  vire.hidden = !emPe;
  if (emPe) pausar();
}

// Controles ficam presos nos cantos da tela (perto dos polegares)
function montarControles() {
  var u = limitar(Math.min(W, H) / 380, 0.8, 1.5);
  var R = 58 * u, r = 34 * u, sx = 68 * u, sy = 62 * u;
  var cx = W - SEG.r - 14 - sx - r, cy = H - SEG.b - 10 - sy - r;
  var rp = 21 * u;
  CTRL = {
    u: u,
    joy: { x: SEG.l + 22 + R, y: H - SEG.b - 18 - R, R: R },
    bot: {
      pulo:     { x: cx,      y: cy + sy, r: r, nome: 'PULO',     cor: '#2e9e44' },
      chute:    { x: cx - sx, y: cy,      r: r, nome: 'CHUTE',    cor: '#1e88e5' },
      dash:     { x: cx + sx, y: cy,      r: r, nome: 'DRIBLE',   cor: '#fb8c00' },
      especial: { x: cx,      y: cy - sy, r: r, nome: 'ESPECIAL', cor: '#ffc400' },
    },
    pausa: { x: W - SEG.r - 12 - rp, y: SEG.t + 10 + rp, r: rp },
    som:   { x: W - SEG.r - 12 - rp * 3 - 10, y: SEG.t + 10 + rp, r: rp },
  };
}

// =================================================================
// ENTRADA: toque e teclado viram um "controle"
// =================================================================
var toques = new Map();          // id do dedo -> { tipo: 'joy'|'botao', nome, x, y }
var teclas = {};
var TECLAS = {
  ArrowLeft: 'esquerda', KeyA: 'esquerda', ArrowRight: 'direita', KeyD: 'direita',
  ArrowUp: 'cima', KeyW: 'cima', ArrowDown: 'baixo', KeyS: 'baixo',
  KeyZ: 'chute', KeyJ: 'chute', KeyX: 'pulo', KeyK: 'pulo', Space: 'pulo',
  KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash', KeyV: 'especial', Semicolon: 'especial',
};

function lerControle() {
  var c = criarControle(), k;

function desenharDica(t) {

  palavras.forEach(function (p) { var tt = l ? l + ' ' + p : p; if (ctx.measureText(tt).width > larg - 24 * u && l) { linhas.push(l); l = p; } else l = tt; });
  linhas.push(l);

  var bx = Math.max(10, b.x - b.r - 26 * u - larg), by = limitar(b.y - h / 2 - 30 * u, SEG.t + 60, H - h - 10);
  var balanco = Math.sin(t * 8) * 4 * u;

  parte('M' + (px - 2) + ',' + (py - 10 * u) + ' L' + (b.x - b.r - 6 * u + balanco) + ',' + b.y + ' L' + (px - 2) + ',' + (py + 10 * u) + ' Z', '#fffde7', { linha: 3 });
  preencher('M' + (px - 5) + ',' + (py - 8 * u) + ' L' + (px - 5) + ',' + (py + 8 * u) + ' L' + (px + 2) + ',' + py + ' Z', '#fffde7');

  ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 8 + Math.sin(t * 8) * 3, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function desenharControles(jogo, t) {
  emTela();
  var c = lerControle(), J = CTRL.joy;
  // direcional: bola com setas
  circulo(J.x, J.y, J.R, 'rgba(255,255,255,0.13)');
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(J.x, J.y, J.R, 0, Math.PI * 2); ctx.stroke();
  [['cima', 0, -1], ['baixo', 0, 1], ['esquerda', -1, 0], ['direita', 1, 0]].forEach(function (s) {
    var ax = J.x + s[1] * J.R * 0.74, ay = J.y + s[2] * J.R * 0.74, a = J.R * 0.14;
    ctx.fillStyle = c[s[0]] ? '#ffd600' : 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.moveTo(ax + s[1] * a, ay + s[2] * a);
    ctx.lineTo(ax - s[2] * a - s[1] * a * 0.6, ay + s[1] * a - s[2] * a * 0.6);
    ctx.lineTo(ax + s[2] * a - s[1] * a * 0.6, ay - s[1] * a - s[2] * a * 0.6);
    ctx.closePath(); ctx.fill();
  });
  var kx = 0, ky = 0;
  toques.forEach(function (tq) {
    if (tq.tipo === 'joy') {
      var dx = tq.x - J.x, dy = tq.y - J.y, m = Math.hypot(dx, dy), lim = J.R * 0.5;
      if (m > lim) { dx = dx / m * lim; dy = dy / m * lim; }
      kx = dx; ky = dy;
    }
  });
  ctx.globalAlpha = 0.92; bola(J.x + kx, J.y + ky, J.R * 0.42, kx * 0.02); ctx.globalAlpha = 1;

  // botões
  var pronto = jogo.craque.especial >= AJUSTES.craque.segmentosEspecial;
  for (var k in CTRL.bot) {
    var b = CTRL.bot[k], apertado = c[k], apagado = k === 'especial' && !pronto;
    ctx.save(); ctx.translate(b.x, b.y); if (apertado) ctx.scale(0.9, 0.9); ctx.translate(-b.x, -b.y);
    ctx.globalAlpha = apagado ? 0.35 : apertado ? 0.95 : 0.7;
    circulo(b.x, b.y + 4, b.r, 'rgba(0,0,0,0.35)');
    parte(oval(b.x, b.y, b.r, b.r), b.cor, { sombraY: b.y + b.r * 0.35, corSombra: 'rgba(0,0,0,0.2)', brilho: oval(b.x - b.r * 0.25, b.y - b.r * 0.45, b.r * 0.5, b.r * 0.25), linha: 3 });
    ctx.globalAlpha = apagado ? 0.5 : 1;
    iconeBotao(k, b);
    ctx.restore();
    if (k === 'dash' && jogo.craque.dashRecarga > 0) {
      var tot = AJUSTES.craque.dashTempo + AJUSTES.craque.dashRecarga, falta = jogo.craque.dashRecarga / tot;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - falta)); ctx.stroke();
    }
    if (k === 'especial' && pronto) {
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,214,0,' + (0.5 + Math.sin(t * 10) * 0.5) + ')';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 7, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  desenharDica(t);
  // pausa e som
  [CTRL.pausa, CTRL.som].forEach(function (b, i) {
    circulo(b.x, b.y, b.r, 'rgba(11,22,64,0.7)');
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    var s = b.r / 21;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5 * s;
    if (i === 0) { ctx.fillRect(b.x - 6 * s, b.y - 7 * s, 4 * s, 14 * s); ctx.fillRect(b.x + 2 * s, b.y - 7 * s, 4 * s, 14 * s); }
    else {
      ctx.beginPath(); ctx.moveTo(b.x - 9 * s, b.y - 4 * s); ctx.lineTo(b.x - 4 * s, b.y - 4 * s); ctx.lineTo(b.x + 2 * s, b.y - 9 * s);
      ctx.lineTo(b.x + 2 * s, b.y + 9 * s); ctx.lineTo(b.x - 4 * s, b.y + 4 * s); ctx.lineTo(b.x - 9 * s, b.y + 4 * s); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      if (app.mudo) { ctx.moveTo(b.x + 5 * s, b.y - 5 * s); ctx.lineTo(b.x + 11 * s, b.y + 5 * s); ctx.moveTo(b.x + 11 * s, b.y - 5 * s); ctx.lineTo(b.x + 5 * s, b.y + 5 * s); }
      else ctx.arc(b.x + 3 * s, b.y, 7 * s, -0.8, 0.8);
      ctx.stroke();
    }
  });
}

// =================================================================
// DESENHAR TUDO
// =================================================================
function desenhar() {
  var t = app.t;
  emTela();
  ctx.fillStyle = '#07140d'; ctx.fillRect(0, 0, W, H);
  garantirFundo();
  var tx = 0, ty = 0;
  if (app.tremor > 0) { tx = (Math.random() - 0.5) * 14 * app.tremor; ty = (Math.random() - 0.5) * 14 * app.tremor; }
  emMundo(tx, ty);
  if (app.zoom > 0) { ctx.translate(LARG / 2, ALT / 2); ctx.scale(1 + app.zoom, 1 + app.zoom); ctx.translate(-LARG / 2, -ALT / 2); }
  ctx.drawImage(fundo, 0, 0, LARG, ALT);
  if (OX > 1) {   // celular comprido: continua o estádio nas laterais, mais escuro
    ctx.drawImage(fundo, -LARG, 0, LARG, ALT); ctx.drawImage(fundo, LARG, 0, LARG, ALT);
    ctx.fillStyle = 'rgba(7,20,13,0.55)'; ctx.fillRect(-LARG, 0, LARG, ALT); ctx.fillRect(LARG, 0, LARG, ALT);
  }
  app.alvos = [];
  if (app.tela === 'inicio' || app.tela === 'ajuda') {
    if (!app.pose) app.pose = criarPose();
    desenharCena(app.pose, t);
    emMundo();
    if (app.tela === 'inicio') telaInicio(t); else telaAjuda(t);
    return;
  }
  var jogo = app.jogo;
  desenharCena(jogo, t);
  desenharParticulas();
  emMundo();
  if (app.tela === 'luta' || app.tela === 'pausa') desenharHUD(jogo, t);
  desenharBanner(t);
  if (app.tela === 'luta') desenharControles(jogo, t);
  else {
    emMundo();
    if (app.tela === 'pausa') telaPausa();
    if (app.tela === 'vitoria') telaVitoria(t);
    if (app.tela === 'derrota') telaDerrota(t);
  }
}

// LAÇO PRINCIPAL
// =================================================================
var ultimo = performance.now();
function quadro(agora) {
  var dt = Math.min(0.1, Math.max(0, (agora - ultimo) / 1000));
  ultimo = agora; app.t += dt;
  if (app.tela === 'luta' && app.jogo) {
    var ctrl = lerControle();
    if (app.congelar > 0) app.congelar -= dt;     // "hit-stop": congela um tiquinho no impacto
    else passoJogo(app.jogo, ctrl, dt);
    app.jogo.craque.mirandoCima = ctrl.cima;
    efeitosDoQuadro(app.jogo, dt);
    var driblando = app.jogo.craque.dashTempo > 0;
    if (driblando && !app.dashAntes) som('drible');
    app.dashAntes = driblando;
    verificarDicas(app.jogo);
    processarEventos();
    checarFim(dt);
  }
  atualizarEfeitos(dt);
  try { desenhar(); } catch (e) { console.error(e); }
  requestAnimationFrame(quadro);
}

// Para testes automáticos
window.__app = app;
Object.defineProperty(window, '__jogo', { get: function () { return app.jogo; } });
window.__controle = lerControle;
window.__ctrl = function () { return CTRL; };
window.__alvos = function () {
  return app.alvos.map(function (a) { return { nome: a.nome, x: OX + (a.x + a.w / 2) * ESC, y: OY + (a.y + a.h / 2) * ESC }; });
};

function iniciar(dados) {
  if (dados && (dados.dificuldade === 'amador' || dados.dificuldade === 'profissional')) app.dificuldade = dados.dificuldade;
  if (dados && dados.mudo) app.mudo = true;
  carregarSprites();
  medir();
  requestAnimationFrame(quadro);
  // guarda o jogo no celular para abrir sem internet (só funciona no endereço publicado)
  try { if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* ok */ }
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { dificuldade: app.dificuldade, mudo: app.mudo }; }); } catch (e) { /* ok */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(iniciar);
else iniciar((window.claude && window.claude.hot && window.claude.hot.data) || {});
}
</script>
